[project]
name = "systematic-trading-strategies"
version = "0.1.0"
description = "DSA5205 Project 2 - Designing, backtesting, and evaluating systematic trading strategies using machine learning and quantitative financial analysis."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "joblib==1.6.0",
    "matplotlib==3.11.2",
    "numpy==2.5.3",
    "pandas==2.3.3",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "tqdm==4.70.1",
    "yfinance==1.7.0",
]

[dependency-groups]
dev = [
    "ipykernel==7.3.0",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

