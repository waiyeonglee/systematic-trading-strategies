[project]
name = "systematic-trading-strategies"
version = "0.1.0"
description = "DSA5205 Project 2 - cross-asset weekly ML trading strategy on 16 ETFs, benchmarked against SPY, equal-weight and AR(1)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipython==9.17.1",
    "joblib==1.6.0",
    "matplotlib==3.11.2",
    "numpy==2.5.3",
    "openpyxl==3.1.5",
    "pandas==2.3.3",
    "pyyaml==6.0.3",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "seaborn==0.13.2",
    "ta-lib==0.8.2",
    "tqdm==4.70.1",
    "yfinance==1.7.0",
]

[dependency-groups]
dev = [
    "ipykernel==7.3.0",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
